name: CD

# Al hacer merge a main, corre los tests y publica un binario
# standalone (empaquetado con pkg) como GitHub Artifact.
on:
  push:
    branches: [main]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests
        run: npm test

      - name: Construir binario
        run: npx pkg . --targets node18-linux-x64 --output dist/shop502-cart

      - name: Publicar binario en GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shop502-cart-binary
          path: dist/shop502-cart
          retention-days: 30
